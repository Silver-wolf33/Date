<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date With Me 💖</title>
    <link
      href="https://api.fontshare.com/v2/css?f[]=dancing-script@400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      body {
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #d374a7, #e3dfc1, #e8b392, #d374a7);
      }

      /* Floating Hearts */
      .heart {
        position: absolute;
        animation: float 6s linear infinite;
        opacity: 0;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) scale(0);
          opacity: 0;
        }

        50% {
          opacity: 1;
        }

        100% {
          transform: translateY(-120vh) scale(1.5);
          opacity: 0;
        }
      }

      /* Heart Beat */
      .love-beat {
        animation: beat 1.4s infinite;
      }

      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.15);
        }
      }
      .ramisha {
        font-family: "Dancing Script", cursive;
      }
    </style>
  </head>

  <body class="relative flex items-center justify-center min-h-screen">
    <!-- Floating Hearts -->
    <div class="heart text-5xl left-[10%]" style="animation-delay: 0s">💖</div>

    <div class="heart text-4xl left-[25%]" style="animation-delay: 2s">💕</div>

    <div class="heart text-6xl left-[50%]" style="animation-delay: 4s">💘</div>

    <div class="heart text-5xl left-[70%]" style="animation-delay: 1s">❤️</div>

    <div class="heart text-4xl left-[85%]" style="animation-delay: 3s">💗</div>

    <!-- Main Card -->
    <div
      class="z-10 w-[90%] max-w-xl p-10 text-center border shadow-2xl backdrop-blur-xl rounded-3xl"
      style="
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.4);
      "
    >
      <!-- Cute Animation -->
      <div class="mb-6 text-8xl love-beat" style="color: #c71573">💝</div>

      <!-- Heading -->
      <h1
        class="mb-10 text-4xl font-bold leading-snug md:text-5xl"
        style="color: #c71573"
      >
        Hey
        <span
          class="bg-[linear-gradient(135deg,#c71573,#FF00B8,#6A00FF)] bg-clip-text text-transparent ramisha"
          >Ramisha</span
        >! <br />
        Will you go on a date with me? 🥺
      </h1>

      <!-- Smaller Button Area -->
      <div
        id="buttonArea"
        class="relative w-[320px] h-36 mx-auto overflow-hidden"
      >
        <!-- YES BUTTON -->
        <button
          onclick="goNext()"
          class="absolute px-8 py-3 text-lg font-semibold text-white transition-all duration-300 shadow-lg left-5 top-10 rounded-2xl hover:scale-110"
          style="background: #c71573"
        >
          Yes 😍
        </button>

        <!-- NO BUTTON -->
        <button
          id="noBtn"
          class="absolute px-8 py-3 text-lg font-semibold transition-all duration-75 shadow-md rounded-2xl"
          style="left: 180px; top: 40px; background: #e3dfc1; color: #c71573"
        >
          No 😭
        </button>
      </div>
    </div>

    <script>
      const noBtn = document.getElementById("noBtn");
      const buttonArea = document.getElementById("buttonArea");

      noBtn.addEventListener("mouseenter", () => {
        const areaWidth = buttonArea.clientWidth;
        const areaHeight = buttonArea.clientHeight;

        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        const randomX = Math.random() * (areaWidth - btnWidth);
        const randomY = Math.random() * (areaHeight - btnHeight);

        noBtn.style.left = `${randomX}px`;
        noBtn.style.top = `${randomY}px`;
      });

      function goNext() {
        window.location.href = "page2.html";
      }
    </script>
  </body>
</html>
