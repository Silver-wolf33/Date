<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick a Date 💖</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      body {
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #e3dfc1, #e8b392, #9fd8b3);
      }

      /* Floating Hearts */
      .heart {
        position: absolute;
        animation: float 6s linear infinite;
        opacity: 0;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) scale(0);
          opacity: 0;
        }

        50% {
          opacity: 1;
        }

        100% {
          transform: translateY(-120vh) scale(1.5);
          opacity: 0;
        }
      }

      /* Card Animation */
      .card-show {
        animation: show 1s ease;
      }

      @keyframes show {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.95);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      input[type="date"],
      input[type="time"] {
        color-scheme: light;
      }
    </style>
  </head>

  <body class="relative flex items-center justify-center min-h-screen">
    <!-- Floating Hearts -->
    <div class="heart text-5xl left-[10%]" style="animation-delay: 0s">💖</div>

    <div class="heart text-4xl left-[25%]" style="animation-delay: 2s">💕</div>

    <div class="heart text-6xl left-[50%]" style="animation-delay: 4s">💘</div>

    <div class="heart text-5xl left-[70%]" style="animation-delay: 1s">❤️</div>

    <div class="heart text-4xl left-[85%]" style="animation-delay: 3s">💗</div>

    <!-- Main Card -->
    <div
      class="z-10 w-[90%] max-w-xl p-10 border shadow-2xl rounded-3xl backdrop-blur-xl card-show"
      style="
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.4);
      "
    >
      <!-- Heading -->
      <div class="mb-8 text-center">
        <div class="mb-4 text-7xl">🥹💌</div>

        <h1 class="mb-4 text-4xl font-bold" style="color: #c71573">
          So… when are you free?
        </h1>

        <p class="text-lg" style="color: #6b2150">
          Pick a cute date and time for our little romantic adventure ✨
        </p>
      </div>

      <!-- FORM -->
      <form onsubmit="goNext(event)" class="space-y-7">
        <!-- CUSTOM DATE PICKER -->
        <div class="relative">
          <label
            class="block mb-3 text-lg font-semibold"
            style="color: #c71573"
          >
            Pick a Date 📅
          </label>

          <!-- Trigger Box -->
          <div
            onclick="toggleDate()"
            class="cursor-pointer px-5 py-4 rounded-2xl border text-lg backdrop-blur-md flex justify-between items-center"
            style="
              background: rgba(255, 255, 255, 0.7);
              border-color: #e8b392;
              color: #5c3a3a;
            "
          >
            <span id="dateText">Select date </span>
            <span>&#128198;</span>
          </div>

          <!-- Popup Calendar -->
          <input
            id="dateInput"
            type="date"
            class="absolute top-full left-0 mt-2 opacity-0 pointer-events-none"
          />
        </div>

        <!-- CUSTOM CLOCK STYLE TIME PICKER -->
        <div class="relative">
          <label
            class="block mb-3 text-lg font-semibold"
            style="color: #c71573"
          >
            Pick a Time ⏰
          </label>

          <!-- Trigger Box -->
          <div
            onclick="toggleTime()"
            class="cursor-pointer px-5 py-4 rounded-2xl border text-lg backdrop-blur-md flex justify-between items-center"
            style="
              background: rgba(255, 255, 255, 0.7);
              border-color: #e8b392;
              color: #5c3a3a;
            "
          >
            <span id="timeText">Select time </span>
            <span>🕰️</span>
          </div>

          <!-- Popup Time -->
          <input
            id="timeInput"
            type="time"
            class="absolute top-full left-0 mt-2 opacity-0 pointer-events-none"
          />
        </div>

        <!-- BUTTON -->
        <button
          type="submit"
          class="w-full py-4 mt-4 text-xl font-semibold text-white transition-all duration-300 rounded-2xl hover:scale-[1.02]"
          style="background: linear-gradient(to right, #c71573, #c9a24d)"
        >
          Okey Next &#8594;
        </button>
      </form>
    </div>

    <script>
      const dateInput = document.getElementById("dateInput");
      const timeInput = document.getElementById("timeInput");

      const dateText = document.getElementById("dateText");
      const timeText = document.getElementById("timeText");

      function toggleDate() {
        dateInput.showPicker();
      }

      function toggleTime() {
        timeInput.showPicker();
      }

      dateInput.addEventListener("change", () => {
        dateText.textContent = new Date(dateInput.value).toDateString();
      });

      timeInput.addEventListener("change", () => {
        timeText.textContent = timeInput.value;
      });
      function goNext(event) {
        event.preventDefault();

        const date = document.getElementById("dateInput").value;
        const time = document.getElementById("timeInput").value;

        localStorage.setItem("date", date);
        localStorage.setItem("time", time);

        window.location.href = "page4.html";
      }
    </script>
  </body>
</html>
